name: Web build (GitHub Pages)

# Быстрая тестовая версия игры в браузере. Публикуется на GitHub Pages при пуше в main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - 'match3/**'
      - '.github/workflows/web.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: '4.5.1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Import, smoke test, export Web
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path godot --editor --quit 2>&1 | tee build/import.log
          timeout 120 godot --headless --path godot --quit-after 600 2>&1 | tee build/run.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access" build/import.log build/run.log; then
            echo "::error::GDScript errors found"; exit 1
          fi
          # Имя файлов = коммит: браузер не возьмёт старую игру из кэша.
          NAME="game-${GITHUB_SHA::8}"
          godot --headless --path godot --export-release Web "$GITHUB_WORKSPACE/build/web/$NAME.html"
          test -s "build/web/$NAME.html"
          cat > build/web/index.html <<HTML
          <!DOCTYPE html><html><head><meta charset="utf-8">
          <meta http-equiv="Cache-Control" content="no-cache">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Охотник за Вратами</title>
          <script>location.replace("$NAME.html" + location.search);</script>
          </head><body style="background:#000"></body></html>
          HTML
          ls -la build/web

      - name: Match-3 — import, bot test, export Web (/match3/)
        run: |
          set -euo pipefail
          mkdir -p build/web/match3
          godot --headless --path match3 --editor --quit 2>&1 | tee build/m3-import.log
          # Бот проходит 6 уровней случайными ходами: ловим ошибки логики поля.
          timeout 300 godot --headless --path match3 -- --bot=6 2>&1 | tee build/m3-run.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access" build/m3-import.log build/m3-run.log; then
            echo "::error::Match-3 GDScript errors found"; exit 1
          fi
          grep -q "BOT done" build/m3-run.log
          # Ввод как на телефоне: свайп, два тапа и мышь должны делать ход.
          timeout 120 godot --headless --path match3 -- --inputtest 2>&1 | tee build/m3-input.log || true
          grep -q "INPUT TEST OK" build/m3-input.log
          NAME="m3-${GITHUB_SHA::8}"
          godot --headless --path match3 --export-release Web "$GITHUB_WORKSPACE/build/web/match3/$NAME.html"
          test -s "build/web/match3/$NAME.html"
          cat > build/web/match3/index.html <<HTML
          <!DOCTYPE html><html><head><meta charset="utf-8">
          <meta http-equiv="Cache-Control" content="no-cache">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Три в ряд</title>
          <script>location.replace("$NAME.html" + location.search);</script>
          </head><body style="background:#000"></body></html>
          HTML
          ls -la build/web/match3

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
