name: Android debug APK

on:
  # APK собирается только вручную (финальная проверка на телефоне). Для быстрых тестов — веб-версия (web.yml).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      GODOT_VERSION: '4.5.1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/build-tools"
          ls "$ANDROID_HOME/build-tools"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Yandex Ads Godot plugin (AAR)
        run: |
          set -euo pipefail
          gradle -p android-plugins/yandex-ads assembleRelease --no-daemon --stacktrace
          mkdir -p godot/addons/yandex_ads/bin
          cp android-plugins/yandex-ads/build/outputs/aar/YandexAds-release.aar godot/addons/yandex_ads/bin/
          ls -la godot/addons/yandex_ads/bin

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Create debug signing key
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Godot Android export paths
        run: |
          set -euo pipefail
          JAVA_HOME_PATH="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          test -d "$JAVA_HOME_PATH"
          test -d "$ANDROID_HOME"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME_PATH"
          EOF
          echo "Android SDK: $ANDROID_HOME"
          echo "Java SDK: $JAVA_HOME_PATH"
          ls -la "$HOME/.config/godot/editor_settings-4.tres"

      - name: Import and export Android APK
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path godot --editor --quit --verbose 2>&1 | tee build/import.log
          # Smoke-тест: запустить игру на ~10 секунд без экрана; ошибки скриптов валят сборку.
          timeout 120 godot --headless --path godot --quit-after 600 2>&1 | tee build/run.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access" build/import.log build/run.log; then
            echo "::error::GDScript errors found"; exit 1
          fi
          godot --headless --path godot --install-android-build-template --export-debug Android "$GITHUB_WORKSPACE/build/ai-game-studio-debug.apk" --verbose
          test -s build/ai-game-studio-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-game-studio-debug-apk
          path: build/ai-game-studio-debug.apk
          if-no-files-found: error

      - name: Publish APK to debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="debug-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" build/ai-game-studio-debug.apk --prerelease \
            --target "$GITHUB_SHA" --title "Debug APK ($GITHUB_REF_NAME)" \
            --notes "Автосборка debug APK, коммит $GITHUB_SHA" -R "$GITHUB_REPOSITORY"
